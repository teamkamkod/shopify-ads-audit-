# This file stores configurations for your Shopify app.
client_id = "75a59b2e81d7ad057f912eb542f50b5e"
name = "ChatGPT Ads Audit"
# Placeholder — `shopify app dev` overwrites this with the live tunnel URL
# on each run. `shopify app deploy` sets the real production URL.
application_url = "https://chatgpt-ads-audit.kamkod.com"
embedded = true

[access_scopes]
# read_products is required to read barcode/GTIN via the Admin API
# (not exposed on the public /products.json endpoint). write_products
# is also required here: the CLI's declarative-webhook scope validator
# doesn't accept read_products alone for the products/update topic
# (see https://github.com/Shopify/cli/issues/4417 for a similar case),
# even though the app itself never writes products.
scopes = "read_products,write_products"

[auth]
# Also overwritten with the live tunnel URL by `shopify app dev`.
redirect_urls = [
  "https://chatgpt-ads-audit.kamkod.com/auth/callback",
  "https://chatgpt-ads-audit.kamkod.com/auth/shopify/callback",
  "https://chatgpt-ads-audit.kamkod.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Re-audits a single product on change; the handler no-ops for shops on
  # the Free plan (alerting is a paid-tier feature — Free is a one-time
  # audit only, never recurring monitoring).
  # Handled by: /app/routes/webhooks.products.update.tsx
  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products/update"

  # Mandatory compliance topics for public apps.
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
